[build]
  command = "pnpm build"
  publish = "dist/public"

# Keep browser requests same-origin while routing server APIs to Railway.
[[redirects]]
  from = "/api/*"
  to = "https://skybet-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SKYBET is a single-page React application at the static-preview layer.
# The Express/tRPC server remains the authenticated production API on Railway.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.4.1"
